[project]
name = "robot"
version = "0.1.0"
description = "Assistant robot host MVP: laptop mic → STT → agent stub → TTS → speakers (ESP32 later)"
readme = "README.md"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
]

[project.scripts]
robot = "robot.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
